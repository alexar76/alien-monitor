<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOMUS eye</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04030f;
        overflow: hidden;
      }
      #root {
        position: absolute;
        inset: 0;
      }

    <div id="root"></div>
    <script type="module" src="/src/momusEyeEmbed.tsx"></script>
  </body>
</html>
